blueprint:
  name: Lock Code Manager Credential Notifications
  description: >-
    Send notifications when a Lock Code Manager credential (PIN) is used to lock or
    unlock a door. Monitors every current and future name/credential configured under
    the selected Lock Code Manager instance automatically -- add or remove names in
    LCM and this automation keeps working without any changes here.


    Uses the unified `lock_code_manager_credential_used` event (LCM 5.2.0+),
    which replaced the now-deprecated `lock_code_manager_lock_state_changed`
    event. If you're updating an existing automation created from an older
    version of this blueprint, re-import this blueprint and it will keep
    working with the same inputs.
  domain: automation
  author: Johan Henkens (https://github.com/jhenkens)
  source_url: https://raw.githubusercontent.com/jhenkens/ha-blueprints/main/automations/lcm_slot_notifications.yaml
  input:
    lcm_config_entry:
      name: Lock Code Manager Instance
      description: >-
        The Lock Code Manager integration instance to monitor. Every current and
        future name/credential configured under this instance is automatically
        included -- no need to touch this automation when names are added or removed
        in LCM.
      selector:
        config_entry:
          integration: lock_code_manager
    notify_devices:
      name: Notification Devices
      description: Devices to notify when a monitored credential is used.
      default: []
      selector:
        device:
          integration: mobile_app
          multiple: true
    use_home_name:
      name: Title Notifications Using Home's Friendly Name
      description: >-
        If enabled, notification titles will be prefixed with the friendly name
        of zone.home (e.g. "My Home - Jake and Ny").
      default: false
      selector:
        boolean:
    notify_on_lock:
      name: Notify on Lock Events
      description: If enabled, also send notifications when the credential is used to lock the door.
      default: false
      selector:
        boolean:
    ignore_devices:
      name: Names to Ignore
      description: >-
        Select Lock Code Manager users/names to never notify for -- e.g. your own
        long-running code, or a permanent resident's code you don't need pinged
        for. Pick the LCM device itself rather than typing the name, so it can't
        drift out of sync if the name changes. New names are still auto-included
        as they're added in LCM -- this only excludes the specific devices you
        pick here. Note: this list shows LCM devices across any LCM instance on
        this system, not just the one selected above.
      default: []
      selector:
        device:
          integration: lock_code_manager
          multiple: true

variables:
  lcm_config_entry: !input lcm_config_entry
  notify_devices: !input notify_devices
  use_home_name: !input use_home_name
  home_name: >-
    {{ state_attr('zone.home', 'friendly_name') if use_home_name else '' }}
  notify_on_lock: !input notify_on_lock
  ignore_devices: !input ignore_devices
  ignore_names_lower: >-
    {% set names = namespace(values=[]) %}
    {% for device_id in ignore_devices %}
      {% for entity_id in device_entities(device_id) %}
        {% if entity_id.startswith('text.') and entity_id.endswith('_name') %}
          {% set names.values = names.values + [states(entity_id) | lower | trim] %}
        {% endif %}
      {% endfor %}
    {% endfor %}
    {{ names.values }}

triggers:
  - trigger: event
    event_type: lock_code_manager_credential_used

conditions:
  - condition: template
    value_template: >-
      {{ trigger.event.data.config_entry_id == lcm_config_entry }}
  - condition: template
    value_template: >-
      {{ trigger.event.data.operation != 'lock' or notify_on_lock }}
  - condition: template
    value_template: >-
      {{ (trigger.event.data.name | lower | trim) not in ignore_names_lower }}

actions:
  - variables:
      target_name: >-
        {{ state_attr(trigger.event.data.target, 'friendly_name') | default(trigger.event.data.target, true) }}
      source_name: >-
        {{ state_attr(trigger.event.data.source, 'friendly_name') | default(trigger.event.data.source, true) }}
      operation_word: >-
        {{ {'lock': 'locked', 'unlock': 'unlocked'}.get(trigger.event.data.operation, 'used') }}
  - repeat:
      for_each: "{{ notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            title: "{{ home_name }}"
            message: >-
              {{ target_name }} was {{ operation_word }} by {{ trigger.event.data.name }}
              {%- if source_name != target_name %} via {{ source_name }}{% endif -%}.

mode: queued
max: 10