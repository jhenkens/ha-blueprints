blueprint:
  name: Integrated Motion Night Light
  author: Johan Henkens (https://github.com/jhenkens)
  homeassistant:
    min_version: "2023.3.0"
  description: >-
    For night light devices with integrated motion sensors
  domain: automation
  source_url: https://raw.githubusercontent.com/jhenkens/ha-blueprints/main/automations/motion_night_lights.yaml
  input:
    motion_entities:
      name: Motion entity
      description: This motion entity should have a light on the same device
      default: []
      selector:
        entity:
          multiple: true
          domain: binary_sensor
          device_class:
            - motion
            - occupancy
    scope_to_night:
      name: Scope to Night
      description: If enabled, motion will only turn lights on between sunset and sunrise. If disabled, motion turns lights on regardless of time of day.
      default: true
      selector:
        boolean:
    color_temp_kelvin:
      name: Color Temperature
      description: The color temperature to set the light to when motion is detected.
      default: 2000
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
          mode: slider
    turn_on_transition:
      name: Turn On Transition
      description: The transition time, in seconds, when turning the light on.
      default: 3
      selector:
        number:
          min: 0
          max: 30
          step: 1
          unit_of_measurement: seconds
          mode: slider
    turn_off_transition:
      name: Turn Off Transition
      description: The transition time, in seconds, when turning the light off.
      default: 10
      selector:
        number:
          min: 0
          max: 30
          step: 1
          unit_of_measurement: seconds
          mode: slider
    use_illuminance:
      name: Use Illuminance
      description: If enabled, motion will only turn lights on if the device's illuminance sensor reads below Max Illuminance.
      default: false
      selector:
        boolean:
    max_illuminance:
      name: Max Illuminance
      description: The illuminance level, in lux, below which motion is allowed to turn the light on. Only used when Use Illuminance is enabled.
      default: 10
      selector:
        number:
          min: 0
          max: 1000
          step: 1
          unit_of_measurement: lx
          mode: slider
    illuminance_delay:
      name: Illuminance Delay
      description: How long to wait, in seconds, after motion is detected before checking illuminance. Only used when Use Illuminance is enabled.
      default: 0
      selector:
        number:
          min: 0
          max: 300
          step: 1
          unit_of_measurement: seconds
          mode: slider

mode: parallel
max_exceeded: warning

trigger:
  - id: &id000 Motion Detected
    platform: state
    entity_id: !input motion_entities
    from: "off"
    to: "on"
  - id: &id001 Motion Cleared
    platform: state
    entity_id: !input motion_entities
    from: "on"
    to: "off"
    for:
      minutes: 1
  - id: &id003 HA Start
    platform: homeassistant
    event: start

variables:
  input_scope_to_night: !input scope_to_night
  trigger_motion_entity: >-
    {%- if trigger is defined and trigger.entity_id is defined -%}
    {{ trigger.entity_id }}
    {%- endif -%}
  trigger_light_entity: >-
    {%- if trigger_motion_entity -%}
    {{ device_entities(device_id(trigger_motion_entity )) | select('search', '^light[.]') | first }}
    {%- endif -%}

condition:
  - condition: or
    conditions:
      - alias: "Motion Detected Condition"
        condition: and
        conditions:
          - condition: trigger
            id: *id000
          - condition: or
            conditions:
              - "{{ not input_scope_to_night }}"
              - condition: sun
                after: sunset
                before: sunrise
          - "{{ is_state(trigger_light_entity,'off') }}"
      - alias: "Motion Cleared Condition"
        condition: and
        conditions:
          - condition: trigger
            id: *id001
          - "{{ is_state(trigger_light_entity,'on') }}"
      - alias: "HA Start or Manual Run"
        condition: template
        value_template: "{{ not trigger_motion_entity }}"

action:
  - variables:
      input_motion_entities: !input motion_entities
      input_color_temp_kelvin: !input color_temp_kelvin
      input_turn_on_transition: !input turn_on_transition
      input_turn_off_transition: !input turn_off_transition
      input_light_entities: "{{ input_motion_entities | map('device_id') | map('device_entities') | map('select','search', '^light[.]') | map('first') | list }}"
      input_use_illuminance: !input use_illuminance
      input_max_illuminance: !input max_illuminance
      input_illuminance_delay: !input illuminance_delay
      trigger_illuminance_entity: >-
        {%- if trigger_motion_entity -%}
        {{ device_entities(device_id(trigger_motion_entity )) | select('search', '^sensor[.]') | select('is_state_attr', 'device_class', 'illuminance') | first }}
        {%- endif -%}
      is_manual_run: "{{ trigger.id is not defined }}"
      lights_any_on: "{{ input_light_entities | select('is_state', 'on') | list | count > 0 }}"
  - choose:
      - conditions:
          - condition: trigger
            id: *id000
        sequence:
          - if:
              - condition: template
                value_template: "{{ input_use_illuminance and trigger_illuminance_entity }}"
            then:
              - delay: "{{ input_illuminance_delay }}"
              - if:
                  - condition: template
                    value_template: "{{ states(trigger_illuminance_entity) | float(0) >= input_max_illuminance }}"
                then:
                  - stop: "Illuminance above threshold after delay"
          - service: light.turn_on
            data:
              transition: "{{ input_turn_on_transition }}"
              color_temp_kelvin: "{{ input_color_temp_kelvin }}"
            target:
              entity_id: "{{ trigger_light_entity }}"
      - conditions:
          - condition: trigger
            id: *id001
        sequence:
          - service: light.turn_off
            data:
              transition: "{{ input_turn_off_transition }}"
            target:
              entity_id: "{{ trigger_light_entity }}"
      - alias: "Manual Run - Turn On"
        conditions:
          - "{{ is_manual_run and not lights_any_on }}"
        sequence:
          - service: light.turn_on
            data:
              transition: "{{ input_turn_on_transition }}"
              color_temp_kelvin: "{{ input_color_temp_kelvin }}"
            target:
              entity_id: "{{ input_light_entities }}"
    default:
      - service: light.turn_off
        data:
          transition: "{{ input_turn_off_transition }}"
        target:
          entity_id: "{{ input_light_entities }}"
